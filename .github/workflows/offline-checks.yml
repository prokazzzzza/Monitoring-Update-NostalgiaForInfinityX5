name: Offline checks

on:
  push:
    branches: [main, Minor_test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir pip==26.2.1
          python -m pip install --no-cache-dir -r MonitoringForUpdateStratagia/requirements.txt pytest==9.1.1 pytest-cov==7.0.0 ruff==0.16.1 pip-audit==2.10.1
          python -m pip check
      - name: Preserve strategy snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD:MonitoringForUpdateStratagia/Update/NostalgiaForInfinityX5.py)" = 5e679cdff476ba8b22a612cd615af10ba90266be
      - name: Offline regressions
        env:
          PYTHON_DOTENV_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests -q --cov=app --cov=config --cov=main --cov-report=term-missing --cov-fail-under=80
      - name: Lint changed application and tests
        run: python -m ruff check --select E4,E7,E9,F,I --no-cache MonitoringForUpdateStratagia/app MonitoringForUpdateStratagia/config MonitoringForUpdateStratagia/main.py tests
      - name: Audit full installed dependency closure
        run: python -m pip_audit --progress-spinner off
  container:
    name: Container build only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build without starting application
        run: docker build --tag monitoring-offline-check MonitoringForUpdateStratagia
